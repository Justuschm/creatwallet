# Monitoring für die Wallet-Pass-Plattform: zusammen mit der Plattform starten
#
#   docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
# Oberflächen sind nur auf dem Server selbst erreichbar (127.0.0.1) - von deinem Rechner per
# SSH-Tunnel oder VPN, z. B.:  ssh -L 3000:127.0.0.1:3000 -L 3001:127.0.0.1:3001 -L 8001:127.0.0.1:8001 server
#   Grafana      http://localhost:3000   (Metriken, Logs, Alarme)   Benutzer admin / GRAFANA_ADMIN_PASSWORD
#   Uptime Kuma  http://localhost:3001   (Erreichbarkeit von außen, Statusseite)
#   GlitchTip    http://localhost:8001   (Fehlerberichte der Plattform)
services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-v3.5.0}
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus

  loki:
    image: grafana/loki:${LOKI_TAG:-3.5.0}
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  # Sammelt die Logs aller Container ein und schickt sie an Loki
  alloy:
    image: grafana/alloy:${ALLOY_TAG:-v1.10.0}
    restart: unless-stopped
    command: ["run", "/etc/alloy/config.alloy", "--storage.path=/var/lib/alloy"]
    volumes:
      - ./monitoring/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy_data:/var/lib/alloy
    depends_on: [loki]

  grafana:
    image: grafana/grafana:${GRAFANA_TAG:-12.1.0}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Bitte GRAFANA_ADMIN_PASSWORD in .env setzen}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_DEFAULT_LOCALE: de-DE
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on: [prometheus, loki]

  uptime-kuma:
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG:-2}
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime_kuma_data:/app/data

  # Fehlerberichte (Sentry-kompatibel). Alles in einem Container, Warteschlange in PostgreSQL.
  glitchtip-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: glitchtip
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: ${GLITCHTIP_DB_PASSWORD:?Bitte GLITCHTIP_DB_PASSWORD in .env setzen}
    volumes:
      - glitchtip_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d glitchtip -U glitchtip"]
      interval: 5s
      retries: 20

  glitchtip:
    image: glitchtip/glitchtip:${GLITCHTIP_TAG:-6}
    restart: unless-stopped
    depends_on:
      glitchtip-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: postgres://glitchtip:${GLITCHTIP_DB_PASSWORD}@glitchtip-db:5432/glitchtip
      VALKEY_URL: ""
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?Bitte GLITCHTIP_SECRET_KEY in .env setzen}
      GLITCHTIP_DOMAIN: http://localhost:8001
      DEFAULT_FROM_EMAIL: ${AUTHENTIK_BOOTSTRAP_EMAIL:-monitoring@example.de}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: "false"
      GLITCHTIP_ENABLE_UPTIME: "false"
    volumes:
      - glitchtip_uploads:/code/uploads

volumes:
  prometheus_data:
  loki_data:
  alloy_data:
  grafana_data:
  uptime_kuma_data:
  glitchtip_db:
  glitchtip_uploads:
