global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # API (alle Prozesse zusammengefasst)
  - job_name: wallet-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Worker - jede Instanz einzeln (docker compose --scale worker=N)
  - job_name: wallet-worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9101

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
