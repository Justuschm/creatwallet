[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creatwallet"
version = "1.0.0"
description = "Apple Wallet Pässe (.pkpass) erstellen, prüfen und signieren - inkl. Poster-Event-Tickets, semantischer Boarding-Pässe und Poster-Generic-Pässe"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["cryptography>=41"]

[project.optional-dependencies]
# Plattform-API (Python >= 3.11): pip install -e ".[server]"
server = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "segno>=1.6",
]

[project.scripts]
creatwallet = "creatwallet.cli:main"

[tool.setuptools]
packages = ["creatwallet", "app", "app.api"]

[tool.setuptools.package-data]
creatwallet = ["web/*.html"]
